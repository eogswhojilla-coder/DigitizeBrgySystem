# Railway/nixpacks configuration for Laravel with GD extension (required for barcode/QR)

[phases.setup]
nixPkgs = ['...', 'nodejs']

[phases.install]
cmds = ['install-php-extensions gd']

[phases.build]
cmds = [
    'composer install --optimize-autoloader --no-dev --no-scripts --no-interaction',
    'npm ci',
    'npm run build',
    'php artisan storage:link || true',
    'mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache',
    'chmod -R 775 storage bootstrap/cache'
]

[start]
cmd = 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT'
